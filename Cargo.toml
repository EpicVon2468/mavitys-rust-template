[package]
name = "{{project-name}}"
version = "0.0.0"
authors = [
	"Mavity The Madity",
]
edition = "2024"
rust-version = "1.97.0"
homepage = "https://github.com/EpicVon2468/{{project-name}}/"
repository = "https://github.com/EpicVon2468/{{project-name}}/"
license = "MIT OR Apache-2.0"
exclude = [
	".github/",
]

[package.metadata.dist]
dist = true
# https://github.com/axodotdev/cargo-dist/issues/745
#features = [
#]

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"